# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build tooling on Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Setup consumer runtime Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify packed ESM and CommonJS compatibility
        run: npm run check:package
